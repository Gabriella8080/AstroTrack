name: AstroTrack CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      # Linting & Formatting
      - name: Check Formatting
        run: |
          black --check astrotrack tests

      - name: Lint with Ruff
        run: |
          ruff check astrotrack tests

      # Pytests
      - name: Run tests (pytest)
        run: |
          pytest -v

      - name: Run tests with coverage
        run: |
          pip install pytest-cov
          pytest --cov=astrotrack --cov-report=term-missing